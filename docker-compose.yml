services:

  postgres:
    image: postgres:16-alpine
    container_name: asm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: asm_user
      POSTGRES_PASSWORD: asm_password
      POSTGRES_DB: asm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asm_user -d asm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asm_network

  redis:
    image: redis:7-alpine
    container_name: asm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asm_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asm_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - screenshots:/app/screenshots
      - pd_tools:/usr/local/pd_tools
      - nuclei_templates:/home/appuser/nuclei-templates
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - asm_network

  pd_installer:
    image: alpine:latest
    container_name: asm_pd_installer
    restart: "no"
    volumes:
      - pd_tools:/pd_tools
    command: >
      sh -c "
        apk add --no-cache curl jq unzip tar &&
        mkdir -p /pd_tools &&
        echo 'Downloading subfinder...' &&
        SUBFINDER_URL=$$(curl -s https://api.github.com/repos/projectdiscovery/subfinder/releases/latest | jq -r '.assets[] | select(.name | contains(\"subfinder_\") and contains(\"linux_amd64.zip\")) | .browser_download_url') &&
        curl -L \"$$SUBFINDER_URL\" -o /tmp/subfinder.zip && unzip -o /tmp/subfinder.zip subfinder -d /pd_tools/ &&
        echo 'Downloading dnsx...' &&
        DNSX_URL=$$(curl -s https://api.github.com/repos/projectdiscovery/dnsx/releases/latest | jq -r '.assets[] | select(.name | contains(\"dnsx_\") and contains(\"linux_amd64.zip\")) | .browser_download_url') &&
        curl -L \"$$DNSX_URL\" -o /tmp/dnsx.zip && unzip -o /tmp/dnsx.zip dnsx -d /pd_tools/ &&
        echo 'Downloading naabu...' &&
        NAABU_URL=$$(curl -s https://api.github.com/repos/projectdiscovery/naabu/releases/latest | jq -r '.assets[] | select(.name | contains(\"naabu_\") and contains(\"linux_amd64.zip\")) | .browser_download_url') &&
        curl -L \"$$NAABU_URL\" -o /tmp/naabu.zip && unzip -o /tmp/naabu.zip naabu -d /pd_tools/ &&
        echo 'Downloading httpx...' &&
        HTTPX_URL=$$(curl -s https://api.github.com/repos/projectdiscovery/httpx/releases/latest | jq -r '.assets[] | select(.name | contains(\"httpx_\") and contains(\"linux_amd64.zip\")) | .browser_download_url') &&
        curl -L \"$$HTTPX_URL\" -o /tmp/httpx.zip && unzip -o /tmp/httpx.zip httpx -d /pd_tools/ &&
        echo 'Downloading nuclei...' &&
        NUCLEI_URL=$$(curl -s https://api.github.com/repos/projectdiscovery/nuclei/releases/latest | jq -r '.assets[] | select(.name | contains(\"nuclei_\") and contains(\"linux_amd64.zip\")) | .browser_download_url') &&
        curl -L \"$$NUCLEI_URL\" -o /tmp/nuclei.zip && unzip -o /tmp/nuclei.zip nuclei -d /pd_tools/ &&
        echo 'Downloading gowitness...' &&
        GOWITNESS_URL=$$(curl -s https://api.github.com/repos/sensepost/gowitness/releases/latest | jq -r '.assets[] | select(.name | contains(\"gowitness\") and contains(\"linux\") and contains(\"amd64\")) | .browser_download_url') &&
        curl -L \"$$GOWITNESS_URL\" -o /pd_tools/gowitness &&
        rm -f /tmp/*.zip &&
        chmod +x /pd_tools/* &&
        echo 'All ProjectDiscovery tools installed successfully!'
      "
    networks:
      - asm_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asm_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - asm_network

  nginx:
    image: nginx:alpine
    container_name: asm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - screenshots:/app/screenshots:ro
    depends_on:
      - backend
      - frontend
    networks:
      - asm_network

volumes:
  postgres_data:
  screenshots:
  pd_tools:
  nuclei_templates:

networks:
  asm_network:
    driver: bridge
