services:

  postgres:
    image: postgres:16-alpine
    container_name: asm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: asm_user
      POSTGRES_PASSWORD: asm_password
      POSTGRES_DB: asm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asm_user -d asm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asm_network

  redis:
    image: redis:7-alpine
    container_name: asm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asm_network

  pd_installer:
    build:
      context: ./pd-installer
      dockerfile: Dockerfile
    container_name: asm_pd_installer
    restart: "no"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - pd_tools:/usr/local/pd_tools
    networks:
      - asm_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asm_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - screenshots:/app/screenshots
      - pd_tools:/usr/local/pd_tools
      - nuclei_templates:/home/appuser/nuclei-templates
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pd_installer:
        condition: service_completed_successfully
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - asm_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asm_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - asm_network

  nginx:
    image: nginx:alpine
    container_name: asm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - screenshots:/app/screenshots:ro
    depends_on:
      - backend
      - frontend
    networks:
      - asm_network

volumes:
  postgres_data:
  screenshots:
  pd_tools:
  nuclei_templates:

networks:
  asm_network:
    driver: bridge
