version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: asm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: asm_user
      POSTGRES_PASSWORD: asm_password
      POSTGRES_DB: asm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asm_user -d asm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asm_network

  redis:
    image: redis:7-alpine
    container_name: asm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asm_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asm_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - screenshots:/app/screenshots
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - asm_network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asm_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - screenshots:/app/screenshots
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.scan_tasks.celery_app worker --loglevel=info --concurrency=1
    networks:
      - asm_network

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asm_beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - screenshots:/app/screenshots
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.scan_tasks.celery_app beat --loglevel=info
    networks:
      - asm_network



  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asm_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - asm_network

  adminer:
    image: adminer:latest
    container_name: asm_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./adminer.css:/var/www/html/adminer.css
      - ./digi_samurai.php:/var/www/html/plugins-enabled/digi_samurai.php
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - asm_network

  nginx:
    image: nginx:alpine
    container_name: asm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - screenshots:/app/screenshots:ro
    depends_on:
      - backend
      - frontend
    networks:
      - asm_network

volumes:
  postgres_data:
  screenshots:
  nuclei_templates:

networks:
  asm_network:
    driver: bridge
